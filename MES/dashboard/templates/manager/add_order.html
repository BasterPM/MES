<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}  <!-- Отображение формы -->

        {% for field in form %}
            {% for error in field.errors %}
                <div class="error">{{ error }}</div>
            {% endfor %}
        {% endfor %}

        <button type="submit">Создать заказ</button>
    </form>
</head>
<body>

</body>
</html>
